name: Build

on:
  push:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq shellcheck
          shellcheck scripts/*.sh

  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        tune: [cortex-a72, cortex-a76, apple-m1]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld llvm cmake ninja-build nasm

      - name: Build
        run: |
          ./scripts/build.sh -DTUNE_CPU=${{ matrix.tune }}
          cp build/Bin/FEX "FEX-${{ matrix.tune }}"

      - name: Verify static binary
        run: |
          file "FEX-${{ matrix.tune }}"
          ldd "FEX-${{ matrix.tune }}" || true

      - name: Run amd64 debian via docker and binfmt_misc
        run: |
          FEX="$PWD/FEX-${{ matrix.tune }}"
          printf '%s\n' ":FEX-x86_64:M:0:\x7fELF\x02\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\x3e\x00:\xff\xff\xff\xff\xff\xfe\xfe\x00\x00\x00\x00\xff\xff\xff\xff\xff\xfe\xff\xff\xff:$FEX:POCF" | sudo tee /proc/sys/fs/binfmt_misc/register
          arch=$(docker run --rm --platform linux/amd64 debian:stable-slim uname -m)
          echo "guest arch: $arch"
          test "$arch" = "x86_64"
          docker run --rm --platform linux/amd64 debian:stable-slim sh -c 'dpkg --print-architecture && ls /'

      - uses: actions/upload-artifact@v4
        with:
          name: FEX-${{ matrix.tune }}
          path: FEX-${{ matrix.tune }}

  release:
    if: github.ref == 'refs/heads/main' && !cancelled()
    needs: build
    runs-on: ubuntu-slim
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: FEX-*
          path: dist
          merge-multiple: true

      - name: Publish release tagged with upstream commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No variants passed the smoke test; nothing to release."
            exit 1
          fi

          full=$(git rev-parse HEAD:FEX)
          tag=${full:0:9}
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "FEX $tag" \
              --notes "Static-pie FEX built from [FEX-Emu/FEX@$tag](https://github.com/FEX-Emu/FEX/commit/$full) with patches applied. Variants: cortex-a72 (baseline, runs on any ARMv8.0 device incl. Raspberry Pi 4), cortex-a76 (ARMv8.2, Raspberry Pi 5 and most modern boards), apple-m1 (Apple Silicon VMs)."
          fi
